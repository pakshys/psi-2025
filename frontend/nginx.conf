server {
    listen 80;
    server_name cotunes.online www.cotunes.online api.cotunes.online;
    return 301 https://$host$request_uri;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Frontend server
server {
    listen 443 ssl;
    server_name cotunes.online www.cotunes.online;

    ssl_certificate /etc/ssl/cotunes_origin.pem;
    ssl_certificate_key /etc/ssl/cotunes_origin.key;

    root /usr/share/nginx/html;
    index index.html;

    # Serve frontend
    location / {
        try_files $uri /index.html;
    }
}

# Backend proxy server
server {
    listen 443 ssl;
    server_name api.cotunes.online;

    ssl_certificate /etc/ssl/cotunes_origin.pem;
    ssl_certificate_key /etc/ssl/cotunes_origin.key;

    location / {
        proxy_pass http://myapp-backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
